<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6dabc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="セクメト">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/pwa/icon-180.png">
  <title>セクメト</title>
  <link rel="stylesheet" href="/figma-exact.css">
  <link rel="stylesheet" href="/figma-devices.css">
  <link rel="stylesheet" href="/figma-pages.css?v=native-v2">
  <link rel="stylesheet" href="/responsive-layout.css">
</head>
<body>
  <div class="design-viewport">
    <div class="design-canvas" data-node-id="4:2">
      <header class="status-bar" data-node-id="4:3">
        <button id="location-button" aria-label="場所の表示名を変更"><img src="/assets/figma-home/c167e.svg" alt=""><span id="location-label">横浜市</span></button>
        <p class="header-weather">晴れ　21℃</p>
        <p id="header-date">11月10日（火）</p><time id="header-clock">18:20</time>
      </header>
      <main class="design-main" id="home-screen" aria-label="ホーム">
        <section class="outdoor panel" data-node-id="4:3086" aria-labelledby="outdoor-heading">
          <img class="panel-art" src="/assets/figma-home/650f0.svg" alt="">
          <h2 id="outdoor-heading">屋外環境</h2>
          <dl><div class="reading pm"><dt>PM2.5</dt><dd>8.4</dd><span class="unit">µg/m³</span></div><div class="rule r1"></div><div class="reading aqi"><dt>AQI</dt><dd>32</dd></div><div class="rule r2"></div><div class="reading pollen"><dt>花粉</dt><dd>少ない</dd></div></dl>
        </section>
        <section class="agenda panel" data-node-id="4:3099" aria-labelledby="agenda-heading">
          <img class="panel-art" src="/assets/figma-home/d7085.svg" alt="">
          <h2 id="agenda-heading">予定</h2><button id="add-task" class="pixel-button" aria-label="予定を追加">＋</button>
          <div id="task-list"><p>今日は予定がありません</p><small>ゆっくり過ごしましょう</small></div>
        </section>
        <section class="indoor panel" data-node-id="4:3107" aria-labelledby="indoor-heading">
          <img class="panel-art" src="/assets/figma-home/18e4a.svg" alt="">
          <h2 id="indoor-heading">室内環境</h2><span class="comfort">快適</span>
          <dl><div class="reading temperature"><dt>温度</dt><dd>24.6</dd><span class="unit">℃</span></div><div class="rule r1"></div><div class="reading humidity"><dt>湿度</dt><dd>48</dd><span class="unit">%</span></div><div class="rule r2"></div><div class="reading co2"><dt>CO₂</dt><dd>680</dd><span class="unit">ppm</span></div></dl>
        </section>
        <section class="center" aria-label="時計とセクメト">
          <p id="date" data-node-id="4:3124">11月10日 火曜日</p><time id="clock" data-node-id="4:3125">18:20</time>
          <p class="weather">晴れ　 気温 21℃</p><p class="weather-range">最高 23℃　/　最低 15℃</p>
          <div class="speech" data-node-id="4:3128" role="status" aria-live="polite"><img class="panel-art" src="/assets/figma-home/a7c86.svg" alt=""><span class="nameplate"><img src="/assets/figma-home/62e9d.svg" alt=""><span>セクメト</span></span><p id="speech-text">今日は、お部屋を整える日にしませんか？</p></div>
          <img class="speech-tail" src="/assets/figma-home/b831b.svg" alt="" data-node-id="4:4190">
          <button id="pet-speak" aria-label="セクメトのひとこと" data-node-id="4:3135"><img src="/assets/figma-home/44255.png" width="196.35" height="258.72" alt="セクメト"></button>
          <p class="welcome" data-node-id="4:3137">おかえりなさい。</p><p class="room-state" data-node-id="4:3138">お部屋は快適な状態です</p>
        </section>
        <aside class="devices panel" data-node-id="4:3139" aria-labelledby="devices-heading">
          <img class="panel-art" src="/assets/figma-home/370bd.svg" alt=""><h2 id="devices-heading">家電</h2><p id="device-count">2台が稼働中</p>
          <div id="device-summary"></div>
        </aside>
      </main>
      <!-- devices-screen -->
      <!-- extra-screens -->
      <footer class="navigation" data-node-id="4:88"><nav aria-label="画面切り替え"><img class="nav-art" src="/assets/figma-home/9cae3.svg" alt="">
        <button data-screen="0" aria-current="page"><img src="/assets/figma-home/c167e.svg" alt=""><span>ホーム</span></button>
        <button data-screen="1"><img src="/assets/figma-home/0baaf.svg" alt=""><span>デバイス</span></button>
        <button data-screen="2"><img src="/assets/figma-home/1ef47.svg" alt=""><span>音楽</span></button>
        <button data-screen="3"><img src="/assets/figma-home/e375b.svg" alt=""><span>トピック</span></button>
        <button data-screen="4"><img src="/assets/figma-home/34563.svg" alt=""><span>カレンダー</span></button>
        <button data-screen="5"><img src="/assets/figma-home/2e391.svg" alt=""><span>通知</span><i class="unread-dot" aria-label="未読あり"></i></button>
      </nav></footer>
    </div>
  </div>
  <dialog id="task-dialog" aria-labelledby="task-title"><form id="task-form"><div class="dialog-heading"><h2 id="task-title">予定を追加</h2><button type="button" data-close aria-label="閉じる">×</button></div><label>予定<input name="title" maxlength="80" required></label><label>日付<input name="date" type="date" required></label><label>時刻<input name="time" type="time" value="18:00" required></label><button type="submit" class="pixel-button">追加する</button></form></dialog>
  <dialog id="device-dialog" aria-labelledby="device-title"><div class="dialog-heading"><h2 id="device-title"></h2><button type="button" data-close aria-label="閉じる">×</button></div><button id="device-power" class="pixel-button"></button><label id="device-setting"><span id="device-setting-label"></span><output id="device-value"></output><input id="device-range" type="range"></label></dialog>
  <dialog id="location-dialog" aria-labelledby="location-title"><form id="location-form"><div class="dialog-heading"><h2 id="location-title">場所</h2><button type="button" data-close aria-label="閉じる">×</button></div><label>表示名<input name="location" maxlength="40" required></label><button type="submit" class="pixel-button">保存する</button></form></dialog>
  <p id="feedback" role="status" hidden></p>
  <script type="module" src="/figma-exact.js"></script>
</body>
</html>
